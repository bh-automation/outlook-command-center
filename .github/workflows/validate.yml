# Prüft jeden Pull Request (Pflicht-Statuscheck im Ruleset).
name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository-Validator
        run: python3 tools/validate_repo.py
      - name: Logik-Tests
        run: node --test tests/logic.test.js
